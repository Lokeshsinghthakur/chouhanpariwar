    #tree-simple {
      width: 100%;
      height: 90vh;
      overflow: auto;
      border: 1px solid #ccc;
      position: relative;
    }
    .node {
      padding: 6px 10px;
      border: 1px solid #777;
      border-radius: 6px;
      background: #fffef7;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .node.highlighted {
      border: 2px solid red;
      background: #ffe0e0;
    }
    .node.adjacent {
      border: 2px solid blue;
      background: #e0f0ff;
    }
    #search-container {
      padding: 10px;
      text-align: center;
      position: relative;
    }
    #search-input {
      padding: 5px;
      font-size: 14px;
      width: 200px;
    }
    #search-button, #reset-button {
      padding: 5px 10px;
      margin-left: 5px;
      cursor: pointer;
    }
    #suggestions {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      background: white;
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .suggestion-item {
      padding: 5px;
      cursor: pointer;
    }
    .suggestion-item:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<div id="search-container">

</div>

function convertToTreantNode(node) {
  const displayName = node.name;
  const genderText = node.gender === "F" ? "महिला" : "पुरुष";
  const img = node.image || (node.gender === "F" ? defaultFemaleImg : defaultMaleImg);
  const uniqueNodeId = `${displayName}-${nodeIdCounter++}`; // Ensure unique ID

  // Build tooltip with all info
  const tooltipParts = [
    `नाम: ${displayName}`,
    `English Name: ${node.englishName || 'N/A'}`,
    node.spouse && `पति/पत्नी: ${node.spouse}`,
    node.dob && `जन्म तिथि: ${node.dob}`,
    node.dod && `मृत्यु तिथि: ${node.dod}`,
    `लिंग: ${genderText}`
  ].filter(Boolean).join("\n");

  const treantNode = {
    innerHTML: `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center;" title="${tooltipParts}" data-node-id="${uniqueNodeId}">
      <img src="${img}" alt="${displayName} photo" style="width:50px; height:50px; border-radius:50%;"/>
      <div>${displayName}</div>
    </div>`,
    nodeId: uniqueNodeId // Unique identifier for search
  };

  if (node.children && node.children.length > 0) {
    treantNode.children = node.children.map(convertToTreantNode);
  }

  return treantNode;
}

// Initialize tree with error handling
try {
  const config = {
    chart: {
      container: "#tree-simple",
      levelSeparation: 100,
      siblingSeparation: 30,
      subTeeSeparation: 30,
      rootOrientation: "SOUTH",
      nodeAlign: "BOTTOM",
      node: {
        HTMLclass: "node"
      }
    },
    nodeStructure: convertToTreantNode(familyData)
  };

  const chart = new Treant(config);
} catch (error) {
  console.error("Error initializing Treant chart:", error);
  alert("वंश वृक्ष लोड करने में त्रुटि: " + error.message);
}

const container = document.getElementById("tree-simple");

// Center father nodes on load
function centerFatherNodes() {
  try {
    const fatherElements = Array.from(document.querySelectorAll('.node')).filter(node => {
      const nodeId = node.getAttribute('data-node-id');
      const nodeName = nodeId.split('-')[0];
      return familyData.children.some(child => (child.name === nodeName || child.englishName === nodeName) && child.children);
    });

    if (fatherElements.length > 0) {
      const rects = fatherElements.map(el => el.getBoundingClientRect());
      const minX = Math.min(...rects.map(r => r.left));
      const maxX = Math.max(...rects.map(r => r.right));
      const minY = Math.min(...rects.map(r => r.top));
      const maxY = Math.max(...rects.map(r => r.bottom));
      const containerRect = container.getBoundingClientRect();

      container.scrollLeft = (minX + maxX - containerRect.width) / 2 + container.scrollLeft;
      container.scrollTop = minY - containerRect.top + container.scrollTop - 50;
      console.log('Centered fathers:', { minX, maxX, minY, maxY, scrollLeft: container.scrollLeft, scrollTop: container.scrollTop });
    } else {
      console.warn("No father nodes found for centering.");
    }
  } catch (error) {
    console.error("Error in centerFatherNodes:", error);
  }
}

// Collect all names for suggestions
function collectAllNames(data, names = []) {
  names.push({ name: data.name, englishName: data.englishName || '' });
  if (data.children) {
    data.children.forEach(child => collectAllNames(child, names));
  }
  return names;
}

const allNames = collectAllNames(familyData);

// Search function to find node by name or English name
function findNodeByName(data, searchTerm) {
  const searchLower = searchTerm.toLowerCase();
  if (data.name.toLowerCase() === searchLower || (data.englishName && data.englishName.toLowerCase() === searchLower)) {
    return data;
  }
  if (data.children) {
    for (const child of data.children) {
      const result = findNodeByName(child, searchTerm);
      if (result) return result;
    }
  }
  return null;
}

// Find adjacent nodes (parents, children, spouse)
function findAdjacentNodes(data, targetNode, parent = null, adjacent = []) {
  // Check if current node is the target
  if (data === targetNode) {
    // Add children
    if (data.children) {
      adjacent.push(...data.children);
    }
    // Add spouse if present
    if (data.spouse) {
      const spouseNode = findNodeByName(familyData, data.spouse);
      if (spouseNode) adjacent.push(spouseNode);
    }
    // Add parent if available
    if (parent) adjacent.push(parent);
    return adjacent;
  }
  // Recurse through children
  if (data.children) {
    for (const child of data.children) {
      findAdjacentNodes(child, targetNode, data, adjacent);
    }
  }
  return adjacent;
}

function clearHighlights() {
  document.querySelectorAll(".node.highlighted, .node.adjacent").forEach(node => {
    node.classList.remove("highlighted", "adjacent");
  });
}

// Search functionality
function performSearch(searchName) {
  if (!searchName) {
    alert("कृपया एक नाम दर्ज करें!");
    return;
  }

  clearHighlights();
  const node = findNodeByName(familyData, searchName);
  if (node) {
    // Highlight the searched node
    const nodeElements = Array.from(document.querySelectorAll(`[data-node-id^="${CSS.escape(node.name)}"], [data-node-id^="${CSS.escape(node.englishName || '')}"]`));
    if (nodeElements.length > 0) {
      nodeElements.forEach(el => el.classList.add("highlighted"));

      // Highlight adjacent nodes
      const adjacentNodes = findAdjacentNodes(familyData, node);
      adjacentNodes.forEach(adjNode => {
        const adjElements = Array.from(document.querySelectorAll(`[data-node-id^="${CSS.escape(adjNode.name)}"], [data-node-id^="${CSS.escape(adjNode.englishName || '')}"]`));
        adjElements.forEach(el => el.classList.add("adjacent"));
      });

      // Scroll to the first matching node
      const firstNodeElement = nodeElements[0];
      firstNodeElement.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });

      setTimeout(() => {
        const rect = firstNodeElement.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        if (rect.top < containerRect.top || rect.bottom > containerRect.bottom || rect.left < containerRect.left || rect.right > containerRect.right) {
          container.scrollLeft = (rect.left - containerRect.left) + container.scrollLeft - containerRect.width / 2 + rect.width / 2;
          container.scrollTop = (rect.top - containerRect.top) + container.scrollTop - containerRect.height / 2 + rect.height / 2;
          console.log('Fallback scroll applied:', { scrollLeft: container.scrollLeft, scrollTop: container.scrollTop });
        }
      }, 500);
      console.log(`Found node: ${searchName}, scrolled to element`, firstNodeElement);
      console.log(`Highlighted adjacent nodes:`, adjacentNodes.map(n => n.name));
    } else {
      console.error(`Node element not found for: ${searchName}`);
      alert("नाम मिला, लेकिन नोड दृश्यमान नहीं है!");
    }
  } else {
    alert("नाम नहीं मिला!");
  }
}

// Autocomplete suggestions
const searchInput = document.getElementById("search-input");
const suggestionsDiv = document.getElementById("suggestions");

searchInput.addEventListener("input", () => {
  const query = searchInput.value.trim().toLowerCase();
  suggestionsDiv.innerHTML = "";
  suggestionsDiv.style.display = "none";

  if (query) {
    const matches = allNames.filter(item => 
      item.name.toLowerCase().includes(query) || 
      (item.englishName && item.englishName.toLowerCase().includes(query))
    ).slice(0, 5); // Limit to 5 suggestions

    if (matches.length > 0) {
      matches.forEach(item => {
        const div = document.createElement("div");
        div.className = "suggestion-item";
        div.textContent = `${item.name} (${item.englishName || 'N/A'})`;
        div.addEventListener("click", () => {
          searchInput.value = item.name;
          suggestionsDiv.innerHTML = "";
          suggestionsDiv.style.display = "none";
          performSearch(item.name);
        });
        suggestionsDiv.appendChild(div);
      });
      suggestionsDiv.style.display = "block";
    }
  }
});

// Hide suggestions when clicking outside
document.addEventListener("click", (e) => {
  if (!searchInput.contains(e.target) && !suggestionsDiv.contains(e.target)) {
    suggestionsDiv.style.display = "none";
  }
});

// Search button event listener
document.getElementById("search-button").addEventListener("click", () => {
  const searchName = searchInput.value.trim();
  performSearch(searchName);
});

// Reset button event listener
document.getElementById("reset-button").addEventListener("click", () => {
  clearHighlights();
  searchInput.value = "";
  suggestionsDiv.innerHTML = "";
  suggestionsDiv.style.display = "none";
  centerFatherNodes();
});

// Initialize view
window.addEventListener("load", () => {
  if (typeof Treant === "undefined") {
    console.error("Treant.js failed to load.");
    alert("वंश वृक्ष लोड करने में त्रुटि: Treant.js लोड नहीं हुआ।");
  } else {
    centerFatherNodes();
  }
});
</script>
